<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Preparadas para el reto?</title>
    <style>
        body { margin: 0; background: #0b0c10; color: white; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { background: #000; border: 4px solid #1f2833; box-shadow: 0 0 30px rgba(0,255,255,0.3); border-radius: 8px; }
        #ui { margin-top: 15px; font-size: 18px; color: #66fcf1; text-shadow: 0 0 5px rgba(102,252,241,0.5); text-align: center; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui">👾 ¡ELIMINA LA INVASIÓN ESPACIAL! 👾<br><span style="font-size:14px; color:#aaa;">Usa las Flechas (← →) para moverte y la Barra Espaciadora para disparar.</span></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;
let gameOver = false;
let gameWon = false;
let confetti = [];

// Jugador ágil y fluido
const player = { x: canvas.width / 2 - 25, y: canvas.height - 60, w: 50, h: 30, speed: 8, bullets: [] };

// Configuración de los 32 enemigos (4 filas x 8 columnas)
const enemyRows = 4;
const enemyCols = 8;
const enemies = [];
for (let r = 0; r < enemyRows; r++) {
    for (let c = 0; c < enemyCols; c++) {
        enemies.push({ x: c * 70 + 130, y: r * 50 + 60, w: 40, h: 30, alive: true });
    }
}
let enemySpeed = 1.2;
let enemyDirection = 1;

const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// Disparos cómodos con ráfaga equilibrada
let lastShot = 0;
function shoot() {
    const now = Date.now();
    if (now - lastShot > 250) { 
        player.bullets.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 15, speed: 10 });
        lastShot = now;
    }
}

// Generador de confeti para la gran revelación
function deploConfetti() {
    for (let i = 0; i < 120; i++) {
        confetti.push({
            x: canvas.width / 2,
            y: canvas.height / 2 - 20,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12 - 4,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            size: Math.random() * 6 + 4
        });
    }
}

function update() {
    if (gameOver) return;

    if (gameWon) {
        confetti.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.18; 
        });
        return;
    }

    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;
    if (keys["Space"]) shoot();

    player.bullets.forEach((b, index) => {
        b.y -= b.speed;
        if (b.y < 0) player.bullets.splice(index, 1);
    });

    let changeDirection = false;
    let aliveCount = 0;

    enemies.forEach(e => {
        if (!e.alive) return;
        aliveCount++;
        e.x += enemySpeed * enemyDirection;
        if (e.x + e.w > canvas.width || e.x < 0) changeDirection = true;
        
        // Si algún marciano llega abajo, se acaba el juego (pero baja despacio para dar margen)
        if (e.y + e.h >= player.y) gameOver = true;
    });

    if (aliveCount === 0 && !gameWon) {
        gameWon = true;
        deploConfetti();
    }

    if (changeDirection) {
        enemyDirection *= -1;
        enemies.forEach(e => { if (e.alive) e.y += 18; });
    }

    player.bullets.forEach((b, bIdx) => {
        enemies.forEach(e => {
            if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                e.alive = false;
                player.bullets.splice(bIdx, 1);
                score += 50;
            }
        });
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo espacial de estrellas fijas
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    for(let i=0; i<40; i++) {
        ctx.fillRect((i*83)%canvas.width, (i*127)%canvas.height, 2, 2);
    }

    if (!gameWon) {
        // Nave de las jugadoras (Verde neón brillante)
        ctx.fillStyle = "#00ffcc";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        // Disparos
        ctx.fillStyle = "#ffff00";
        player.bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

        // Los 32 Marcianos (Magenta retro)
        ctx.fillStyle = "#ff007f";
        enemies.forEach(e => {
            if (e.alive) {
                ctx.fillRect(e.x, e.y, e.w, e.h);
                // Detalles de los ojos/antenas de los marcianitos
                ctx.fillStyle = "#000";
                ctx.fillRect(e.x + 8, e.y + 8, 6, 6);
                ctx.fillRect(e.x + e.w - 14, e.y + 8, 6, 6);
                ctx.fillStyle = "#ff007f";
            }
        });
    }

    // Puntuación en pantalla
    ctx.fillStyle = "#66fcf1";
    ctx.font = "18px monospace";
    ctx.textAlign = "left";
    ctx.fillText(`SCORE: ${score}`, 20, 35);

    // Si pierden (Pantalla de reintento suave)
    if (gameOver) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff3333";
        ctx.font = "bold 40px sans-serif";
        ctx.fillText("¡CASI! RECARGA LA PÁGINA", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "20px monospace";
        ctx.fillStyle = "#fff";
        ctx.fillText("¡Inténtalo otra vez, que el premio lo merece!", canvas.width / 2, canvas.height / 2 + 30);
    }

    // ¡¡PANTALLA DE VICTORIA CON EL MENSAJE!!
    if (gameWon) {
        confetti.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        ctx.textAlign = "center";
        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 32px sans-serif";
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#00ffcc";
        ctx.fillText("BIENVENIDA, CÓDIGO DE ACCESO: C0RT@N@", canvas.width / 2, canvas.height / 2);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px monospace";
        ctx.fillText("¡Estás dentro de la misión! 🍿🎉", canvas.width / 2, canvas.height / 2 + 65);
    }
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
